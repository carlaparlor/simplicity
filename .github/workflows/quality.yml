name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Architecture and workflow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python3 tools/check_architecture.py
      - name: Require changed tests and documentation on PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_architecture.py --base "$BASE_SHA"
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  build:
    name: Native (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DSIMPLICITY_WITH_JUCE=ON
      - run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.config }}
          path: build/Testing/Temporary/
  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSIMPLICITY_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sanitizer-logs
          path: build/Testing/Temporary/
  coverage:
    name: First-party coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -r tools/requirements-test.txt
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSIMPLICITY_COVERAGE=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Enforce 95% lines and 90% branches
        run: >-
          .venv/bin/gcovr --root . --filter 'modules/'
          --exclude-unreachable-branches --exclude-throw-branches
          --fail-under-line 95 --fail-under-branch 90 --print-summary
          --xml-pretty --output build/coverage.xml build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-and-logs
          path: |
            build/coverage.xml
            build/Testing/Temporary/
  required:
    name: Required gates
    if: always()
    needs: [policy, build, sanitizers, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, cancelled or skipped prerequisites
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          PY
